<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Bridge Control</title></head>
<body>
  <h3>Page Control Bridge</h3>
  <button id="status">status</button>
  <button id="content">content</button>
  <button id="next">next page</button>
  <input id="url" placeholder="https://example.com" style="width:320px" />
  <button id="open">open</button>
  <pre id="out" style="white-space:pre-wrap"></pre>
<script>
function sendRuntimeMessage(message) {
  return new Promise((resolve, reject) => {
    const runtime = (typeof chrome !== 'undefined' && chrome.runtime)
      || (typeof browser !== 'undefined' && browser.runtime)
      || null;
    if (!runtime) {
      reject(new Error('extension runtime unavailable'));
      return;
    }
    runtime.sendMessage(message, (response) => {
      const error = (typeof chrome !== 'undefined' && chrome.runtime)
        ? chrome.runtime.lastError
        : null;
      if (error) reject(new Error(error.message));
      else resolve(response);
    });
  });
}

async function call(cmd, params={}) {
  try {
    const res = await sendRuntimeMessage({cmd, params});
    document.getElementById('out').textContent = JSON.stringify(res, null, 2);
  } catch (error) {
    document.getElementById('out').textContent = JSON.stringify({ ok: false, error: error.message }, null, 2);
  }
}
document.getElementById('status').onclick = () => call('status');
document.getElementById('content').onclick = () => call('content');
document.getElementById('next').onclick = () => call('next');
document.getElementById('open').onclick = () => call('open', {url: document.getElementById('url').value});
</script>
</body></html>
